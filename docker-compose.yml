services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
      MAX_UPLOAD_MB: 100
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - contentsignal_uploads:/app/data/uploads
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  contentsignal_uploads:
